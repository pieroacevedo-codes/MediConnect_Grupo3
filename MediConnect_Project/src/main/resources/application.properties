spring.application.name=MediConnect_Project
# Configuracion de conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/HealthLink
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate / JPA
spring.jpa.properties.hibernate.default_schema=MediConnect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true